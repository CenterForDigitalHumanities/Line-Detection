<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Detection — TPEN Interface</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #a64129;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header h1 { margin: 0; font-size: 1.2rem; }

        #status {
            padding: 8px 20px;
            background: #fff8dc;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
            min-height: 36px;
        }
        #status.error   { background: #ffe4e4; color: #900; }
        #status.success { background: #e4ffe4; color: #060; }

        #controls {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            background: #a64129;
            color: #fff;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #c55030; }
        button:disabled { background: #aaa; cursor: default; }
        button.secondary {
            background: #555;
        }
        button.secondary:hover:not(:disabled) { background: #333; }

        #image-area {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #detector-wrapper {
            max-width: 1200px;
            width: 100%;
        }

        handwriting-line-detector {
            display: block;
            width: 100%;
            border: 1px solid #ccc;
            background: #eee;
            min-height: 200px;
        }

        #login-prompt {
            padding: 40px 20px;
            text-align: center;
        }
        #login-prompt a {
            color: #a64129;
        }
    </style>
</head>
<body>
    <header>
        <h1>Line Detection — TPEN 3 Interface</h1>
    </header>

    <div id="status">Initialising…</div>

    <div id="controls" style="display:none;">
        <button id="detectBtn">Detect Lines</button>
        <button id="saveBtn" disabled>Save Lines as Annotations</button>
        <button id="clearBtn" class="secondary" disabled>Clear Detected Lines</button>
    </div>

    <div id="image-area">
        <div id="login-prompt" style="display:none;">
            <p>You must be logged in to use this interface.</p>
            <p><a id="loginLink" href="#">Log in with TPEN 3</a></p>
        </div>
        <div id="detector-wrapper" style="display:none;">
            <handwriting-line-detector id="detector"></handwriting-line-detector>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
